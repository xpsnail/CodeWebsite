<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云笔记公开资料</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/site.css">
</head>
<body class="is-home">
  <main class="page">
    <section class="card">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 3.75h10A2.25 2.25 0 0 1 19.25 6v14.25L12 16.5l-7.25 3.75V6A2.25 2.25 0 0 1 7 3.75Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        健康资料
      </div>
      <h1>云笔记公开资料</h1>
      <p class="lead">点击下方条目，查看对应指导内容。</p>
      <div class="entry-list" id="entry-list" aria-live="polite">
        <p class="lead" style="margin:0">正在加载文章列表…</p>
      </div>
    </section>
  </main>
  <script>
    (function () {
      var listEl = document.getElementById("entry-list");
      var iconSvg =
        '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
        '<path d="M8 8.5h8M8 12h8M8 15.5h5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' +
        "</svg>";

      function showError(msg) {
        listEl.innerHTML = '<p class="lead" style="margin:0">' + msg + "</p>";
      }

      function render(articles) {
        if (!articles || !articles.length) {
          showError("暂无文章。请在 Document/articles.json 中添加条目。");
          return;
        }

        listEl.innerHTML = "";
        articles.forEach(function (item, index) {
          var a = document.createElement("a");
          var style = item.style || (index % 2 === 0 ? "primary" : "secondary");
          a.className = style === "secondary" ? "entry-btn secondary" : "entry-btn";
          a.href = "./Document/" + encodeURI(item.file);
          a.innerHTML = iconSvg + " " + (item.title || item.file);
          listEl.appendChild(a);
        });
      }

      fetch("./Document/articles.json", { cache: "no-store" })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(render)
        .catch(function () {
          showError(
            "无法加载文章列表。请通过本地服务器或 GitHub Pages 打开本站（不要直接双击用 file:// 打开），并确认 Document/articles.json 存在。"
          );
        });
    })();
  </script>
</body>
</html>
